name: local parity fixture

on:
  workflow_dispatch:
    inputs:
      scenario:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    steps:
      - name: Run local candidate
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env VERJSON_CI_PROVIDER=github \
            --env VERJSON_CI_SCENARIO="$SCENARIO" \
            --env SCENARIO="$SCENARIO" \
            --entrypoint /bin/sh \
            "$VERJSON_CI_LOCAL_IMAGE" \
            -c 'verjson-ci run --config "test/fixtures/$SCENARIO/verjson-ci.yml" --output ".verjson-ci/local/$SCENARIO-github.json" --compliance-output ".verjson-ci/local/$SCENARIO-github-compliance.json"; status=$?; printf "%s\n" "$status" > ".verjson-ci/local/$SCENARIO-github-exit-code"; exit "$status"'
