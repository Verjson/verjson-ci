name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Validate reproducible GitLab mirror module
        run: |
          terraform -chdir=terraform/gitlab-mirror/test/root init -backend=false -lockfile=readonly
          terraform -chdir=terraform/gitlab-mirror/test/root validate
      - run: pnpm build
      - run: docker build --file container/Dockerfile --tag verjson-ci:test .
      - name: Exercise OCI entrypoint
        run: >-
          docker run --rm
          --volume "$PWD/test/fixtures/success:/workspace"
          --workdir /workspace
          verjson-ci:test
          run --config verjson-ci.yml --output /tmp/result.json
