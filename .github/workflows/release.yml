name: Unified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unprefixed SemVer to release.
        required: true
        type: string
      commit:
        description: Full commit SHA; defaults to the dispatched ref.
        required: false
        type: string
      dry_run:
        description: Exercise all release invariants without tags or publication.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    environment: verjson-ci-release
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
        with:
          cosign-release: v2.4.3
      - name: Validate immutable release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Exercise restart-safe release protocol
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        run: node tools/release/dry-run.mjs "$RELEASE_VERSION" "$RELEASE_COMMIT" .release-proof
      - name: Keylessly sign release proof
        run: node tools/release/cosign.mjs sign .release-proof/manifest.json .release-proof/manifest.sigstore.json
      - name: Verify exact release workflow identity
        run: node tools/release/cosign.mjs verify .release-proof/manifest.json .release-proof/manifest.sigstore.json
      - name: Refuse public release until the legal gate is resolved
        if: ${{ !inputs.dry_run }}
        run: |
          test -f LICENSE || {
            echo '::error::Issue #4 must select a license before the first public release.'
            exit 1
          }
          echo '::error::Public publication remains disabled until issue #4 is resolved.'
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-proof-${{ inputs.version }}
          path: .release-proof/
          if-no-files-found: error
