spec:
  inputs:
    image:
      description: OCI image reference pinned by digest.
      regex: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'
    config:
      description: Repository-relative contract path.
      default: verjson-ci.yml
    job-name:
      description: Name of the generated CI job.
      default: verjson-ci
---
"$[[ inputs.job-name ]]":
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  variables:
    VERJSON_CI_PROVIDER: gitlab
    VERJSON_CI_COMMIT: $CI_COMMIT_SHA
    VERJSON_CI_CONFIG: $[[ inputs.config ]]
  script:
    - verjson-ci run --config "$VERJSON_CI_CONFIG" --output .verjson-ci/result.json
  artifacts:
    when: always
    paths:
      - .verjson-ci/result.json
      - .verjson-ci/shadscan-report.json
