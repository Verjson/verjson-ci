spec:
  inputs:
    image:
      description: Candidate OCI image pinned by digest.
      regex: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'
    scenario:
      description: Conformance fixture scenario.
      options: [success, failure]
    adapter-version:
      description: Exact unified release SemVer used by both adapters.
      regex: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
    job-name:
      default: dispatch-github
---
"$[[ inputs.job-name ]]":
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  id_tokens:
    VERJSON_CI_OIDC_TOKEN:
      aud: verjson-ci-conformance
  variables:
    SCENARIO: $[[ inputs.scenario ]]
    ADAPTER_VERSION: $[[ inputs.adapter-version ]]
  script:
    # Mirror maintainers replace this reviewed literal before signing the protected component tag.
    - >-
      node -e '(async()=>{const token=process.env.VERJSON_CI_OIDC_TOKEN;
      const base="https://coordinator.verjson.org";
      const call=async(path,options={})=>{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(base+path,{...options,redirect:"error",signal:controller.signal});if(!response.ok)throw new Error(`coordinator ${response.status}`);return response.json()}finally{clearTimeout(timeout)}};
      const post=(path,body,headers={})=>call(path,{method:"POST",headers:{"content-type":"application/json",...headers},body:JSON.stringify(body)});
      const grant=await post("/v1/authorize/gitlab",{token});
      const request=await post("/v1/dispatch",{image:process.env.CI_JOB_IMAGE,scenario:process.env.SCENARIO,commit:process.env.CI_COMMIT_SHA,adapterVersion:process.env.ADAPTER_VERSION},{authorization:`Bearer ${grant.capability}`});
      for(let attempt=0;attempt<60;attempt+=1){const verdict=await call(`/v1/verdict/${request.requestId}`);if(verdict.status==="passed")return;if(verdict.status==="failed")throw new Error(`cross-forge parity failed: ${verdict.reason}`);await new Promise(resolve=>setTimeout(resolve,10000))}throw new Error("cross-forge evidence unavailable before deadline")})().catch(error=>{console.error(error.message);process.exit(1)})'
