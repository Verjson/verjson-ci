spec:
  inputs:
    coordinator-url:
      description: HTTPS URL of the claim-validating coordinator.
    image:
      description: Candidate OCI image pinned by digest.
      regex: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'
    scenario:
      description: Conformance fixture scenario.
      options: [success, failure]
    job-name:
      default: dispatch-github
---
"$[[ inputs.job-name ]]":
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  id_tokens:
    VERJSON_CI_OIDC_TOKEN:
      aud: verjson-ci-conformance
  variables:
    COORDINATOR_URL: $[[ inputs.coordinator-url ]]
    SCENARIO: $[[ inputs.scenario ]]
  script:
    - >-
      node -e '(async()=>{const token=process.env.VERJSON_CI_OIDC_TOKEN;
      const base=process.env.COORDINATOR_URL;
      const post=(path,body,headers={})=>fetch(base+path,{method:"POST",headers:{"content-type":"application/json",...headers},body:JSON.stringify(body)}).then(async r=>{if(!r.ok)throw new Error(`coordinator ${r.status}`);return r.json()});
      const grant=await post("/v1/authorize/gitlab",{token});
      await post("/v1/dispatch",{image:process.env.CI_JOB_IMAGE,scenario:process.env.SCENARIO,commit:process.env.CI_COMMIT_SHA},{authorization:`Bearer ${grant.capability}`});})().catch(error=>{console.error(error.message);process.exit(1)})'
